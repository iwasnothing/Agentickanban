# Kanban bot registry. Each Kanban bot maps to one OpenMausBot bot (the worker
# harness) and one git worktree of the project repo on branch bots/<bot-id>.
bots:
  bot-001:
    name: Backend Python bot
    openmausbot_bot_id: 8a7348b7-596f-4a9a-8c13-fa57a262ceaf   # MausBot (OpenMausBot local server)
    openmausbot_bot_name: MausBot
    model: opencodeGo/openrouter/nvidia/nemotron-3-ultra-550b-a55b:free  # OpenRouter free model
    workspace: /workspace/aibots/workspaces/bot-001
    branch: bots/bot-001
    config_dir: bots/bot-001
    enabled: true
